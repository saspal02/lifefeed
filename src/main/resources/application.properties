spring.application.name=lifefeed
spring.docker.compose.lifecycle-management=start_only

#### App ####
app.cors.path-pattern=/api/**
app.cors.allowed-origins=*
app.cors.allowed-methods=*
app.cors.allowed-headers=*
app.openapi.title=lifefeed API
app.openapi.description=lifefeed API Swagger Documentation
app.openapi.version=v1.0.0
app.openapi.contact.name=CompanyName
app.openapi.contact.email=support@company.com
app.jwt.issuer=lifefeed
app.jwt.expires-in=604800
app.jwt.secret=secretsecretsecret12345678901234567890

#### Spring MVC ####
server.compression.enabled=true
server.http2.enabled=true
spring.threads.virtual.enabled=true
#### API Versioning ####
spring.mvc.apiversion.default=1.0
spring.mvc.apiversion.use.header=API_VERSION
spring.mvc.apiversion.supported=1.0
#### Springdoc ####
springdoc.swagger-ui.enabled=false
springdoc.paths-to-match=/api/**

###### Logging ######
logging.level.root=INFO
logging.level.com.saswat.lifefeed=DEBUG
logging.pattern.correlation=[${spring.application.name:},%X{traceId:-},%X{spanId:-}]
logging.include-application-name=false
#logging.level.org.springframework.security=DEBUG

#### Actuator ####
management.endpoints.web.exposure.include=configprops,env,health,info,logfile,loggers
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

#### Database ####
spring.datasource.hikari.auto-commit=false
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.data.jpa.repositories.bootstrap-mode=deferred
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.properties.hibernate.id.optimizer.pooled.preferred=pooled-lo
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.flyway.locations=classpath:/db/migration

#### Spring Modulith ####
spring.modulith.events.jdbc.schema-initialization.enabled=true
spring.modulith.events.completion-mode=update
spring.modulith.events.republish-outstanding-events-on-restart=true







#### BootUI ####
bootui.enabled=off
bootui.mcp.enabled=off
